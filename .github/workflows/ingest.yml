name: Daily ingestion

# Free web hosts stop idle services, so the in-process @Scheduled job cannot be relied on there. This
# workflow runs the same ingestion (the backfill command with --kind=daily) straight against the database.
#
# Skipped unless the repository variable INGEST_ENABLED is "true". Needs these repository secrets:
# ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY, SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, and optionally the variable INGEST_SYMBOLS.

on:
  schedule:
    # 01:30 UTC Tuesday-Saturday = 21:30 New York (EDT) / 20:30 (EST) after each weekday session.
    - cron: '30 1 * * 2-6'
  workflow_dispatch:
    inputs:
      from:
        description: 'First date (YYYY-MM-DD); default 7 days ago'
        required: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp -q package -DskipTests
      - name: Ingest
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          INGEST_SYMBOLS: ${{ vars.INGEST_SYMBOLS }}
          FROM: ${{ inputs.from }}
        run: |
          FROM="${FROM:-$(date -u -d '7 days ago' +%F)}"
          java -jar target/market-data.jar --spring.profiles.active=backfill --kind=daily --from="$FROM"
