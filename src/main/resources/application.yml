spring:
  application:
    name: market-data
  datasource:
    # Override with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
    url: jdbc:postgresql://localhost:5432/marketdata
    username: marketdata
    password: marketdata
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  threads:
    virtual:
      # Java 24+ no longer pins virtual threads inside synchronized blocks (JEP 491), so blocking JDBC
      # calls are fine on virtual threads. The connection pool stays the real concurrency limit.
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind a hosting proxy, trust X-Forwarded-For from private-network proxies so the rate limiter
  # sees the client IP.
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/csv,text/html,text/css,application/javascript
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
      # The chart explorer polls /actuator/health; allow it cross-origin when the UI is hosted elsewhere.
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:}
        allowed-methods: GET
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs

market-data:
  api:
    key-sha256: ${API_KEY_SHA256:}
    # Alpaca's terms do not allow public display of its data without written consent, so only synthetic
    # data is public by default. Set to alpaca,synthetic once consent is in place.
    public-sources: ${PUBLIC_DATA_SOURCES:synthetic}
    max-export-symbols: 100
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      capacity: 30
      requests-per-minute: 60
  demo:
    seed-when-no-keys: ${DEMO_SEED:false}
    symbols: ${DEMO_SYMBOLS:50}
    years: ${DEMO_YEARS:10}
    seed: 0.42
  alpaca:
    base-url: ${ALPACA_DATA_URL:https://data.alpaca.markets}
    key-id: ${ALPACA_API_KEY_ID:}
    secret-key: ${ALPACA_API_SECRET_KEY:}
    feed: ${ALPACA_FEED:iex}
    page-limit: 10000
    symbols-per-request: 100
    connect-timeout: 5s
    read-timeout: 30s
    retry:
      max-attempts: 5
      initial-delay: 500ms
      # Alpaca's free plan allows 200 calls/min; a 429 waits for X-RateLimit-Reset, capped here.
      max-delay: 60s
  ingestion:
    symbols: ${INGEST_SYMBOLS:SPY,QQQ,IWM,DIA,AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,AVGO,JPM,V,MA,UNH,XOM,JNJ,WMT,PG,HD,COST,NFLX,AMD,CRM,ORCL,BAC,KO,PEP,DIS}
    schedule:
      enabled: ${INGEST_SCHEDULE_ENABLED:true}
      # 20:30 New York time on weekdays, well after the 16:00 close.
      cron: "0 30 20 * * MON-FRI"
      zone: America/New_York
      lookback-days: 7
